<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha SecureLoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<div class="login-container">
    <!-- Painel do formulário -->
    <div class="login-form">
        <a class="back-link" href="/login">← Voltar ao login</a>
        <div class="login-brand-mini">✦ SecureLoginPUC</div>
        <h4 class="login-title">Recuperar senha</h4>
        <p class="login-subtitle">Informe seu e-mail cadastrado para restaurar o acesso.</p>

        <form th:action="@{/recoverpassword}" method="post">
            <label class="login-label" for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required>

            <div class="login-button-container">
                <button type="submit">Enviar link de recuperação</button>
            </div>
            <p th:if="${mensagem}" th:text="${mensagem}" style="color:#2e7d32; text-align:center; margin-top:10px; font-size:.85rem;"></p>
        </form>
    </div>

    <!-- Painel visual/identidade -->
    <div class="login-brand-panel">
        <img th:src="@{/images/logo-puc-minas.png}" alt="Logo PUC Minas">
        <p class="brand-slogan">Recupere o acesso com segurança.</p>
    </div>
</div>
</body>

</html>
