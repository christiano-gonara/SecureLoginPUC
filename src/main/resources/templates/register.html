<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro SecureLoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<div class="login-container">
    <!-- Painel do formulário de cadastro -->
    <div class="login-form">
        <a class="back-link" href="/login">← Voltar ao login</a>
        <div class="login-brand-mini">✦ SecureLoginPUC</div>
        <h4 class="login-title">Criar conta</h4>
        <p class="login-subtitle">Preencha os dados para se cadastrar.</p>

        <form th:action="@{/register}" method="post">
            <label class="login-label" for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label class="login-label" for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@email.com" required>

            <label class="login-label" for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="999.999.999-99" required>

            <label class="login-label" for="rg">RG</label>
            <input type="text" id="rg" name="rg" required>

            <label class="login-label" for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" required>

            <label class="login-label" for="instituicao">Instituição de ensino</label>
            <select id="instituicao" name="instituicao" class="login-select" required>
                <option value="">Selecione</option>
                <option value="1">PUC Minas</option>
                <option value="2">Outra Instituição</option>
            </select>

            <label class="login-label" for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" required>

            <label class="login-label" for="confirmacao">Confirme sua senha</label>
            <input type="password" id="confirmacao" name="confirmacao" required>

            <div class="login-button-container">
                <button type="submit">Criar conta</button>
            </div>
            <p th:if="${erro}" th:text="${erro}" style="color:#c0392b; text-align:center; margin-top:10px; font-size:.85rem;"></p>
        </form>
    </div>

    <!-- Painel visual/identidade -->
    <div class="login-brand-panel">
        <img th:src="@{/images/logo-puc-minas.png}" alt="Logo PUC Minas">
        <p class="brand-slogan">Cadastro rápido e seguro em poucos passos.</p>
    </div>
</div>
</body>

</html>
