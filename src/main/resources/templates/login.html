<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SecureLoginPUC</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
<div class="login-container">
    <!-- Painel do formulário -->
    <div class="login-form">
        <div class="login-brand-mini">✦ SecureLoginPUC</div>
        <h4 class="login-title">Bem-vindo(a) de volta</h4>
        <p class="login-subtitle">Acesse sua conta para continuar.</p>

        <form th:action="@{/login}" method="post">
            <label class="login-label" for="username">Usuário ou e-mail</label>
            <input type="text" id="username" name="username" placeholder="voce@email.com" required>

            <label class="login-label" for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required>

            <div class="login-button-container">
                <button type="submit">Entrar</button>
            </div>
        </form>

        <p class="login-redirect-options">
            Ainda não tem conta? <a href="/register">Cadastre-se</a> ·
            <a href="/recoverpassword">Esqueceu sua senha?</a>
        </p>
    </div>

    <!-- Painel visual/identidade -->
    <div class="login-brand-panel">
        <img th:src="@{/images/logo-puc-minas.png}" alt="Logo PUC Minas">
        <p class="brand-slogan">Seu acesso, protegido por padrão.</p>
    </div>
</div>
</body>

</html>
